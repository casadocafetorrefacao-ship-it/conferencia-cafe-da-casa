name: Deploy hardened conference system

on:
  push:
    paths:
      - '.github/workflows/optimize-iphone-scanner.yml'
      - '.deploy/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decode hardened pages
        run: |
          test -f .deploy/producao.html.gz.b64
          test -f .deploy/admin.html.gz.b64
          base64 -d .deploy/producao.html.gz.b64 | gzip -d > producao.html
          base64 -d .deploy/admin.html.gz.b64 | gzip -d > admin/index.html

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          for src,out in [('producao.html','/tmp/producao.js'),('admin/index.html','/tmp/admin.js')]:
              s=Path(src).read_text()
              js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
              Path(out).write_text(js)
          PY
          node --check /tmp/producao.js
          node --check /tmp/admin.js

      - name: Commit generated pages
        run: |
          git config user.name "Cafe da Casa Bot"
          git config user.email "actions@users.noreply.github.com"
          git add producao.html admin/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Aplicar melhorias operacionais da conferência"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
