<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorização Olist</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3efe9;color:#1f1b17;margin:0;padding:32px}.card{max-width:620px;margin:60px auto;background:#fff;border:1px solid #ded7ce;border-radius:16px;padding:24px}.ok{color:#18794e;font-weight:800}.bad{color:#b42318;font-weight:800}code{word-break:break-all}</style></head><body><div class="card"><h1>Conferência Café da Casa</h1><div id="status">Processando autorização da Olist…</div><p style="font-size:13px;color:#6f675f">Você pode fechar esta página depois que a autorização for concluída.</p></div><script>(function(){const p=new URLSearchParams(location.search);const code=p.get('code');const error=p.get('error');const s=document.getElementById('status');if(error){s.innerHTML='<p class="bad">❌ A Olist retornou um erro de autorização.</p><p><code>'+error+'</code></p>';return;}if(code){sessionStorage.setItem('olist_auth_code',code);s.innerHTML='<p class="ok">✅ Autorização recebida da Olist.</p><p>O código de autorização foi recebido com sucesso. A próxima etapa será concluir a conexão segura com o backend.</p>';return;}s.innerHTML='<p class="bad">Nenhum código de autorização foi recebido.</p>';})();</script></body></html>
