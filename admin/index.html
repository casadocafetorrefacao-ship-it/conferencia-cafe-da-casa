<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#261b14"><title>Painel Administrativo • Café da Casa</title><style>:root{--bg:#f3efe9;--card:#fff;--ink:#201a16;--muted:#70665e;--brand:#281d16;--ok:#18794e;--bad:#b42318;--warn:#8a5a00;--line:#ded6cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}header{background:var(--brand);color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:20px}main{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:#f7f3ee;border-radius:10px;padding:12px}.stat b{display:block;font-size:25px}.stat.danger{background:#feeceb}.filters{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #cfc6bb;border-radius:10px;background:#fff}.order{border:1px solid #ece4da;border-radius:12px;padding:12px;margin-top:8px}.order.div{border:2px solid #efaaa4;background:#fff8f7}.order.active{border-color:#e3c56d;background:#fffdf6}.head,.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.status{font-weight:850}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.progress{height:9px;background:#e8e0d8;border-radius:999px;overflow:hidden;margin:8px 0}.bar{height:100%;background:var(--ok)}button,a.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.secondary{background:#ede7df;color:var(--ink)}.primary{background:var(--brand);color:#fff}.alert{display:none;border:2px solid #efaaa4;background:#feeceb;color:#8b1e16;border-radius:14px;padding:13px;margin-bottom:12px;font-weight:850}.alert.show{display:block}.alert strong{font-size:18px}.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:5px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.foot .primary{width:100%;text-align:center}}</style></head><body><header><h1>Painel Administrativo</h1><div style="font-size:12px;opacity:.8">Café da Casa • acompanhamento automático</div></header><main><div id="alert" class="alert"></div><section class="card"><div class="row"><div><h2 style="margin:0">Visão geral</h2><div class="small">Atualiza automaticamente a cada 15 segundos · <span id="last">aguardando primeira atualização</span></div></div><div><span id="conn" class="small">Carregando...</span> <button class="secondary" onclick="load()">Atualizar agora</button></div></div><div class="grid"><div class="stat"><span class="small">Aguardando</span><b id="a">0</b></div><div class="stat"><span class="small">Em conferência</span><b id="e">0</b></div><div class="stat"><span class="small">Conferidos</span><b id="c">0</b></div><div class="stat danger"><span class="small">Divergências</span><b id="d">0</b></div></div><div class="filters"><input id="q" placeholder="Buscar pedido, NF, cliente ou operador" oninput="render()"><select id="sf" onchange="render()"><option value="">Todos os status</option><option>DIVERGÊNCIA</option><option>EM CONFERÊNCIA</option><option>AGUARDANDO</option><option>CONFERIDO</option></select></div><div class="legend"><span>🔴 Divergência</span><span>🟡 Em conferência</span><span>🟢 Conferido</span></div></section><section class="card"><div id="orders" class="small">Carregando...</div></section></main><script>const API='https://bold-limit-b7f0.casadocafetorrefacao.workers.dev/';let data=[];const rank={'DIVERGÊNCIA':0,'EM CONFERÊNCIA':1,'AGUARDANDO':2,'CONFERIDO':3};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function sc(s){if(s==='CONFERIDO')return'ok';if(s==='DIVERGÊNCIA')return'bad';if(s==='EM CONFERÊNCIA')return'warn';return''}async function get(params){const r=await fetch(API+'?'+new URLSearchParams(params),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function render(){const q=document.getElementById('q').value.trim().toLowerCase(),sf=document.getElementById('sf').value,box=document.getElementById('orders');const rows=data.filter(p=>(!sf||p.status===sf)&&(!q||[p.numeroPedido,p.numeroNFe,p.cliente,p.conferidoPor,p.status].join(' ').toLowerCase().includes(q))).sort((x,y)=>(rank[x.status]??9)-(rank[y.status]??9));if(!rows.length){box.textContent='Nenhum pedido encontrado.';return}box.innerHTML='';rows.forEach(p=>{const total=Number(p.totalItens||0),done=Number(p.totalConferidos||0),pct=total?Math.min(100,done/total*100):0;const div=document.createElement('div');div.className='order '+(p.status==='DIVERGÊNCIA'?'div':p.status==='EM CONFERÊNCIA'?'active':'');const href='../consulta.html?pedidoId='+encodeURIComponent(p.pedidoId||'');div.innerHTML='<div class="head"><div><b>Pedido '+esc(p.numeroPedido||'—')+' · NF '+esc(p.numeroNFe||'—')+'</b><div class="small">'+esc(p.cliente||'')+'</div></div><div class="status '+sc(p.status)+'">'+(p.status==='DIVERGÊNCIA'?'⚠️ ':p.status==='CONFERIDO'?'✓ ':'')+esc(p.status||'AGUARDANDO')+'</div></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div class="foot"><div class="small"><b>'+done+'/'+total+'</b> unidades · Operador: '+esc(p.conferidoPor||'—')+'</div><a class="btn primary" href="'+href+'">🔎 Ver conferência</a></div>';box.appendChild(div)})}function updateAlert(n){const a=document.getElementById('alert');if(n>0){a.className='alert show';a.innerHTML='<strong>⚠️ '+n+' pedido(s) com divergência</strong><br>Esses pedidos foram colocados no topo da lista para revisão.'}else{a.className='alert';a.innerHTML=''}}async function load(){document.getElementById('conn').textContent='Atualizando...';try{const x=await get({acao:'dashboard'});if(!x.ok)throw new Error(x.erro||'erro');data=x.pedidos||[];const ca=x.contagens||{};document.getElementById('a').textContent=ca['AGUARDANDO']||0;document.getElementById('e').textContent=ca['EM CONFERÊNCIA']||0;document.getElementById('c').textContent=ca['CONFERIDO']||0;document.getElementById('d').textContent=ca['DIVERGÊNCIA']||0;updateAlert(Number(ca['DIVERGÊNCIA']||0));document.getElementById('conn').innerHTML='<span class="pulse"></span>Online';document.getElementById('conn').className='ok';const t=new Date();document.getElementById('last').textContent='última atualização '+t.toLocaleTimeString('pt-BR');render()}catch(err){document.getElementById('conn').textContent='● Falha de conexão';document.getElementById('conn').className='bad';if(!data.length)document.getElementById('orders').textContent='Não foi possível carregar o painel.'}}load();setInterval(load,15000);</script></body></html>
