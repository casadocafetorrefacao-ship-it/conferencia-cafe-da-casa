<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta da Conferência • Café da Casa</title><style>:root{--bg:#f3efe9;--card:#fff;--ink:#201a16;--muted:#70665e;--brand:#281d16;--ok:#18794e;--bad:#b42318;--warn:#8a5a00;--line:#ded6cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}header{background:var(--brand);color:#fff;padding:18px}header h1{margin:0;font-size:20px}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.muted{color:var(--muted);font-size:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.badge{font-weight:800}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.meta{background:#f7f3ee;border-radius:10px;padding:10px}.meta span{display:block;font-size:10px;color:var(--muted)}.progress{height:10px;background:#e8e0d8;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--ok)}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}.item.done{background:#f2fbf6;border-color:#a7d7ba}.item.partial{background:#fff9e8;border-color:#ead590}.itemHead{display:flex;justify-content:space-between;gap:8px}.div{border:1px solid #f5c2be;background:#feeceb;color:#7f1d1d;border-radius:12px;padding:11px;margin-top:8px}button,a.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer;background:#ede7df;color:var(--ink);display:inline-block}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>Consulta da Conferência</h1><div style="font-size:12px;opacity:.8">Café da Casa • somente leitura</div></header><main><div id="app" class="card">Carregando...</div></main><script>const API='https://bold-limit-b7f0.casadocafetorrefacao.workers.dev/';const pedidoId=new URLSearchParams(location.search).get('pedidoId')||'';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function cls(s){if(s==='CONFERIDO')return'ok';if(s==='DIVERGÊNCIA')return'bad';if(s==='EM CONFERÊNCIA'||s==='PARCIAL')return'warn';return''}function dt(v){return v?esc(String(v).replace('T',' ')):'—'}async function get(params){const q=new URLSearchParams(params);const r=await fetch(API+'?'+q.toString(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}async function load(){const app=document.getElementById('app');if(!pedidoId){app.innerHTML='<b class="bad">Pedido não informado.</b>';return}try{const [p,d]=await Promise.all([get({acao:'pedido',pedidoId}),get({acao:'dashboard'})]);if(!p.ok)throw new Error(p.erro||'erro');const total=Number(p.totalItens||0),done=Number(p.totalConferidos||0),pct=total?Math.min(100,done/total*100):0;let itens='';(p.itens||[]).forEach(i=>{const q=Number(i.quantidadePedida||0),c=Number(i.quantidadeConferida||0),k=c>=q&&q>0?'done':c>0?'partial':'';itens+='<div class="item '+k+'"><div class="itemHead"><div><b>'+esc(i.produto||i.sku||'Produto')+'</b><div class="muted">SKU: '+esc(i.sku||'—')+'</div></div><div class="badge '+cls(i.status)+'">'+esc(i.status||'AGUARDANDO')+'</div></div><div style="margin-top:7px"><b>'+c+' / '+q+'</b> unidades conferidas</div></div>'});const divs=(d.divergencias||[]).filter(x=>x.pedidoId===pedidoId);let diverg=divs.length?'<h3>Divergências registradas</h3>'+divs.map(x=>'<div class="div"><b>'+esc(x.resultado)+'</b> · '+dt(x.dataHora)+'<br><span class="muted">Operador: '+esc(x.usuario||'—')+' · Código lido: '+esc(x.codigoLido||'—')+'</span>'+(x.observacao?'<br>'+esc(x.observacao):'')+'</div>').join(''):'<div style="margin-top:14px;padding:11px;border-radius:12px;background:#e7f6ee;color:var(--ok);font-weight:800">✓ Nenhuma divergência recente registrada para este pedido.</div>';app.innerHTML='<div class="top"><div><div class="muted">CONSULTA ADMINISTRATIVA · NÃO REGISTRA BIP</div><h2 style="margin:4px 0">Pedido '+esc(p.numeroPedido||'—')+' · NF '+esc(p.numeroNFe||'—')+'</h2><div class="muted">'+esc(p.cliente||'')+'</div></div><div><button onclick="load()">Atualizar</button> <a class="btn" href="./admin/">Voltar ao painel</a></div></div><div class="grid"><div class="meta"><span>Status</span><b class="'+cls(p.status)+'">'+esc(p.status||'AGUARDANDO')+'</b></div><div class="meta"><span>Operador</span><b>'+esc(p.conferidoPor||'—')+'</b></div><div class="meta"><span>Início</span><b>'+dt(p.inicioConferencia)+'</b></div><div class="meta"><span>Fim</span><b>'+dt(p.fimConferencia)+'</b></div></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div><b>'+done+' de '+total+' unidades conferidas</b></div><h3>Itens do pedido</h3>'+itens+diverg;}catch(e){app.innerHTML='<b class="bad">Não foi possível carregar esta conferência.</b><div class="muted" style="margin-top:8px">'+esc(e.message)+'</div>'}}load();setInterval(load,15000);</script></body></html>
